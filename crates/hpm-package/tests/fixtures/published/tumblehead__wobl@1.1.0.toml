[package]
path = "tumblehead/wobl"
name = "Wobl"
version = "1.1.0"
description = "Soft bodies, cloth, ropes and strands for Houdini on the GPU: flesh in rigs, jelly, cloth on colliders and itself, tails that drive their joints"
authors = ["Tumblehead <info@tumblehead.com>"]
license = "LicenseRef-Proprietary"
readme = "README.md"
keywords = ["houdini", "simulation", "soft body", "cloth", "flesh", "jiggle", "cuda", "apex", "kinefx", "vbd"]

[compat]
# Bounded: Wobl ships native binaries for the major.minor it builds
# (bin/22.0/), and [runtime] routes HOUDINI_DSO_PATH at
# bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE/dso. The cap is the first
# unsupported major.
houdini = ">=22.0, <23"
# CUDA only: Windows and Linux. macOS waits for the OpenCL port.
platforms = ["windows-x86_64", "linux-x86_64"]

# No [dependencies]: TumbleRig is optional. Everything but the Wobl rig node
# (th::apex_wobl, an APEX node built from TumbleRig's pieces) works without
# it; that node checks for TumbleRig 1.17 or later itself (wobl.startup).

[runtime]
WOBL = { method = "set", value = "$HPM_PACKAGE_ROOT" }
HOUDINI_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE" }
HOUDINI_DSO_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE/dso" }

[stage]
# `hpm build` (local dev) builds the solver DSO into package/bin/. `hpm pack`
# does not run prepack; CI runs build-sops itself (.ci/build_platform.py).
prepack = ["build-sops"]

[stage.profile.debug]

[scripts.build-sops]
cmd = [
    { when = { os = "windows" }, set = "python ../.ci/build_sops.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python ../.ci/build_sops.py --platform linux-x86_64" },
]
python = "3.11"

