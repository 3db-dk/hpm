[package]
path = "tumblehead/tumblerig"
name = "TumbleRig"
version = "1.20.2"
description = "APEX-based character rigging toolkit + CUDA deformer SOP suite for Houdini"
authors = ["Tumblehead <info@tumblehead.com>"]
license = "LicenseRef-Proprietary"
readme = "README.md"
keywords = ["houdini", "apex", "rigging", "character", "animation", "vfx", "cuda", "skinning", "deformation", "wrinkles"]

[compat]
# Manifest 2.0 compat gate (hpm >= 0.16). The Cargo-style version requirement
# below compiles to the Houdini package `enable` expression at pack time.
# ">=22.0" admits all of Houdini 22.x and any later major — a faithful
# translation of the pre-2.0 `[houdini] min_version = "22.0"` (lower bound
# only, no cap).
#
# NOTE on capping: TumbleRig only ships native binaries for the major.minor
# it actually builds (today bin/22.0/), and [runtime] routes HOUDINI_DSO_PATH
# at bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE/dso. A user on a
# Houdini build you have NOT shipped a matching bin/<ver>/ tree for installs
# cleanly and then silently fails to load the SOPs. If you want to fence that
# off, add an EXCLUSIVE upper bound, e.g. ">=22.0, <23". The cap is the first
# UNSUPPORTED major, not the last supported one — a bare "<22" would disable
# all of 22.x (that exact off-by-one was the TumblePipe H22 regression).
houdini = ">=22.0"

# Native platforms this package ships binaries for. Each per-platform CI
# worker (.woodpecker/build-<os>.yml) builds only its own platform's DSOs
# into bin/<major.minor>/ and packs with `hpm pack --platform <id>`, so an
# archive carries exactly that platform's binaries as ordinary tree content.
# This replaces the pre-2.0 [native]/[native.<platform>].files tagging.
#
# macos-aarch64 ships from 1.13. .woodpecker/build-macos.yml compiles on the
# Apple silicon worker -- every verb, the GPU ones on their OpenCL backend only
# (macOS has no CUDA; src/cmake/TumbleRigCuda.cmake; Apple's OpenCL compiler is
# stricter than NVIDIA's and has no fp64) -- and release.yml waits for it.
# (The only CUDA-only DSO, the Wobl solver, is its own package since
# 2026-10-18: tumblehead/wobl.) After a platform change, regenerate the
# [[operators]] index (scripts/gen_operators.py writes the per-platform
# .dll / .so / .dylib paths).
#
# LINUX .so RE-INCLUDE: the .so binaries are gitignored (.gitignore: `*.so`),
# whereas the .dll under bin/ are tracked. Pre-2.0, `[native.linux-x86_64].files`
# force-included the gitignored .so into the linux archive. The 2.0 schema has
# no such glob, so the built .so are re-included explicitly via package/.hpmignore
# (`!bin/**/*.so`, alongside the .dll rule) — otherwise the linux archive would
# ship without its native SOPs.
platforms = ["windows-x86_64", "linux-x86_64", "macos-aarch64"]

# Houdini env. hpm packs these into the generated `tumblerig.json` package
# manifest, which Houdini's package loader parses at startup. Two layers of
# expansion happen:
#   - $HPM_PACKAGE_ROOT is rewritten by hpm at pack time to a Houdini-side
#     reference into the package install dir.
#   - $HOUDINI_MAJOR_RELEASE / $HOUDINI_MINOR_RELEASE pass through hpm
#     verbatim and are expanded by Houdini's package loader at startup.
#
# This is what lets the same archive route H22.0 to bin/22.0/dso, H22.5 to
# bin/22.5/dso, etc. The package dir itself is auto-added to HOUDINI_PATH by
# Houdini via the JSON's `hpath` field — no need to declare it here.
#
# Previously these entries lived in a hand-authored package/TumbleRig.json
# that was outside the hpm pipeline; the desktop launcher couldn't expand
# $HOUDINI_MAJOR_RELEASE in that path, so HDK plugins under bin/22.0/dso/
# silently failed to register. Moving them into [runtime] (was [env] pre-2.0)
# routes them through the manifest Houdini parses, where the variables
# resolve correctly.
[runtime]
TUMBLERIG = { method = "set", value = "$HPM_PACKAGE_ROOT" }
HOUDINI_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE" }
HOUDINI_DSO_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/bin/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE/dso" }

[stage]
# hpm owns the build. `hpm build` (LOCAL dev) runs both prepack scripts:
#   build-sops        — cmake-build the APEX callback DSO + CUDA SOP suite
#                       (HDK; no Houdini license needed) into package/bin/.
#   compile-subgraphs — hython-compile the .apex subgraph sources into
#                       package/apexgraph/*.bgeo (LAUNCHES hython, needs a
#                       license — fine on dev machines). Runs after build-sops
#                       so the freshly built th:: DSOs are registered. Skips
#                       itself when the freshness manifest verifies clean.
# Release CI does NOT run compile-subgraphs: the compiled .bgeo + manifest.json
# are committed (compiled submitter-side via `tr-hda compile`), and
# .ci/build_platform.py runs `hpm run build-sops` + `hpm run verify-subgraphs`
# instead — a license-free digest check. So release runners need no Houdini
# license at all. `hpm pack` does NOT run prepack — only build/run do.
prepack = ["build-sops", "compile-subgraphs"]

# build-sops ports the per-platform cmake loop + arch verification out of the
# .woodpecker/build-*.yml workers into one script. hpm runs [scripts] from the
# manifest directory (package/), so the paths reach up into the repo:
# ../.ci/build_sops.py drives the build, ../src is the cmake source, and the
# output lands in package/bin/ (build_sops.py resolves the repo root via git).
# A [scripts] `when` only supports the `os` axis, so the os->platform mapping
# lives here. The table form pins the interpreter to a uv-managed 3.11 so the
# script does not depend on a `python` on the runner's PATH; cmake/CUDA/Houdini
# are still taken from the system.
# Debug build variant (hpm >= 0.20): `hpm build --profile debug` runs the SAME
# base prepack (no prepack override here, so it inherits [stage].prepack and
# stays in sync with it) with HPM_BUILD_PROFILE=debug, which build_sops.py maps
# to a RelWithDebInfo cmake config — optimized + release CRT (never /MDd; a
# debug-CRT DSO crashes Houdini on load) + .pdb symbols. The CMakeLists
# per-config output dirs drop each .pdb next to its .dll under
# bin/<major.minor>/, where the TumbleTrove dev-override launch syncs them and
# a debugger auto-finds them. PDBs are gitignored, so release archives never
# ship them (hpm staging treats .gitignore as authoritative). NOTE: hpm pack /
# the registry have no profile axis — the debug variant is build-from-source
# for local dev-override debugging only (see the houdini-dso-debug skill).
[stage.profile.debug]

[scripts.build-sops]
cmd = [
    { when = { os = "windows" }, set = "python ../.ci/build_sops.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python ../.ci/build_sops.py --platform linux-x86_64" },
    { when = { os = "macos" }, set = "python ../.ci/build_sops.py --platform macos-aarch64" },
]
python = "3.11"

# compile-subgraphs wraps scripts/compile_subgraphs.py (which runs under hython)
# for LOCAL builds. ../.ci/build_subgraphs.py resolves the same pinned HFS as
# build-sops and launches $HFS/bin/hython. The uv-managed 3.11 here is only for
# the thin wrapper; the actual compile runs in Houdini's interpreter.
[scripts.compile-subgraphs]
cmd = [
    { when = { os = "windows" }, set = "python ../.ci/build_subgraphs.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python ../.ci/build_subgraphs.py --platform linux-x86_64" },
    { when = { os = "macos" }, set = "python ../.ci/build_subgraphs.py --platform macos-aarch64" },
]
python = "3.11"

# verify-subgraphs is the RELEASE-CI replacement for compile-subgraphs: a
# license-free check that the committed apexgraph/*.bgeo + manifest.json match
# their .apex sources, the project.json build pin, and a green picker probe.
# No hython, no Houdini install touched. See scripts/subgraph_manifest.py.
[scripts.verify-subgraphs]
cmd = "python ../.ci/verify_subgraphs.py"
python = "3.11"

