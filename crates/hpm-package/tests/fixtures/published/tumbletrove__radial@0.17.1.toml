[package]
path = "tumbletrove/radial"
name = "Radial"
version = "0.17.1"
description = "Tumblehead's custom radial-menu system for Houdini — viewport (X) and network-editor menus (SOP / LOP / network / viewer), plus the Radial Menu Builder python panel."
readme = "README.md"
keywords = ["houdini", "radial-menu", "viewport", "network-editor", "python-panel"]

[compat]
# Manifest 2.0 schema (hpm 0.16+). Cargo-style version requirement. The bound
# is open-ended on the upper end: this is a pure-Python package (no native
# resolver, no per-major build artifact), so it runs on any Houdini >= 21.
#
# NB: hpm upper bounds are EXCLUSIVE and name the first UNSUPPORTED major, so
# never write `<21` thinking it means "21 and below" — that would compile to
# `houdini_version < '21'` and silently disable the entire package.
houdini = ">=21"

# No [compat].platforms / [runtime] / [stage]: Radial ships a single universal
# archive of pure Python (staged by scripts/_radial_build.py), registers no env
# edits, and is added to HOUDINI_PATH directly by the installer / package
# manager. scripts/python/pythonrc.py is the H22-compatible startup bootstrap.
