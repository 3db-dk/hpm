[package]
path = "acme/deps"
name = "Deps"
version = "1.0.0-beta.1"

[compat]
houdini = "=21.0"

[dependencies]
"acme/tools" = "1.0.0"
"acme/rig" = { version = "2.0.0", optional = true }

[scripts]
build = "python build.py"
serve = { cmd = [{ when = { os = "windows" }, set = "serve.bat" }, { set = "./serve.sh" }], python = "3.11", requirements = ["flask==3.0"] }
