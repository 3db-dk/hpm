# cargo-deny configuration (cargo-deny 0.20). Run with `cargo deny --locked check`;
# CI runs it in .woodpecker/check.yml.

[graph]
all-features = true

[advisories]
# Any vulnerability advisory fails; unmaintained crates fail only when a
# workspace crate depends on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# A `*` version requirement on a crates.io dependency is refused; the
# workspace's own path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no other registry and no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
