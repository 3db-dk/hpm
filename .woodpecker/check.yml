when:
  - event: tag
    ref: "refs/tags/v*"

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: check
    image: bash
    environment:
      # The workers have Houdini installed (/opt/hfs*), so the hconfig
      # conformance test must run rather than silently skip.
      HPM_REQUIRE_HOUDINI: "1"
    commands:
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      - rustup default stable
      # Secret gate: scan the checked-out commit's tracked files (the clone
      # is depth 1) before anything is built. gitleaks 8.30.1, checked
      # against its published SHA-256; reviewed history findings live in
      # .gitleaksignore.
      - mkdir -p .tools
      - curl -fsSL -o .tools/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tools/gitleaks.tar.gz" | sha256sum -c -
      - tar -xzf .tools/gitleaks.tar.gz -C .tools gitleaks
      - .tools/gitleaks git --redact --no-banner --exit-code 1 .
      - cargo fmt --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
      # Dependency gate: advisories, licenses, banned and unknown sources
      # (deny.toml). Installed per run at a pinned version into the
      # workspace, so the shared host's ~/.cargo/bin is not modified.
      - cargo install --locked --quiet --root .tools cargo-deny --version 0.20.2
      - .tools/bin/cargo-deny --locked check
