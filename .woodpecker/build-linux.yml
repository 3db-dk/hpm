when:
  - event: tag
    ref: "refs/tags/v*"
  # A manual run builds and tests the Linux binary without uploading it.
  - event: manual

depends_on:
  - check

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: build
    image: bash
    commands:
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      # rust-toolchain.toml pins the compiler; install it without changing
      # the shared worker's default toolchain.
      # In an AlmaLinux 8 image (ci/linux-el8/), not on this Ubuntu 24.04
      # worker: built here, hpm needed glibc 2.39 and ran on no older
      # distro. The script refuses a binary above Houdini 22's floors
      # (glibc 2.28, GLIBCXX_3.4.22; ci/linux-floors.sh) and writes
      # target/el8/release/hpm, out of reach of the test step's build.
      - bash ci/build-linux-el8.sh
      - target/el8/release/hpm --version

  - name: test
    image: bash
    commands:
      # rust-toolchain.toml pins the compiler; install it without changing
      # the shared worker's default toolchain.
      - rustup toolchain install
      - cargo test --locked --release --workspace

  - name: upload
    image: bash
    when:
      - event: tag
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - bash ci/release-upload.sh target/el8/release/hpm linux-x86_64
