when:
  - event: tag
    ref: "refs/tags/v*"

depends_on:
  - check

labels:
  platform: linux/amd64

skip_clone: true

steps:
  - name: build
    image: bash
    commands:
      - git init
      - git remote add origin ${CI_REPO_CLONE_URL}
      - git fetch --no-tags --depth=1 origin ${CI_COMMIT_SHA}
      - git reset --hard ${CI_COMMIT_SHA}
      # rust-toolchain.toml pins the compiler; install it without changing
      # the shared worker's default toolchain.
      - rustup toolchain install
      - cargo build --locked --release -p hpm-cli --bin hpm

  - name: test
    image: bash
    commands:
      # rust-toolchain.toml pins the compiler; install it without changing
      # the shared worker's default toolchain.
      - rustup toolchain install
      - cargo test --locked --release --workspace

  - name: upload
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - bash ci/release-upload.sh target/release/hpm linux-x86_64
